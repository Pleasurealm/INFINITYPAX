# Infinity Pax — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendly alias for the search function
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

# SPA-style fallback is NOT wanted (multi-page static site); explicit pages only.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
